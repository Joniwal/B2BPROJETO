<!-- ============================================================
     MODAL: Detalhe / Edição de um registro
     ============================================================ -->
<div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="itemModalTitle"><i class="bi bi-card-checklist"></i> Registro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="itemModalAlert"></div>
        <form id="itemForm">
          <input type="hidden" id="f_originalId">
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label">IDCLIENTE *</label>
              <input type="text" class="form-control" id="f_IDCLIENTE" required>
            </div>
            <div class="col-md-8">
              <label class="form-label">Cliente *</label>
              <input type="text" class="form-control" id="f_CLIENTE" required>
            </div>
            <div class="col-md-8">
              <label class="form-label">Endereço</label>
              <input type="text" class="form-control" id="f_ENDERECO">
            </div>
            <div class="col-md-4">
              <label class="form-label">Cidade</label>
              <select class="form-select" id="f_CIDADE"></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Produto</label>
              <input type="text" class="form-control" id="f_PRODUTO">
            </div>
            <div class="col-md-4">
              <label class="form-label">Atividade</label>
              <select class="form-select" id="f_ATIVIDADE"></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Tecnologia</label>
              <select class="form-select" id="f_TECNOLOGIA"></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">VT</label>
              <input type="text" class="form-control" id="f_VT">
            </div>
            <div class="col-md-4">
              <label class="form-label">Status</label>
              <select class="form-select" id="f_STATUS"></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Data Disparo</label>
              <input type="date" class="form-control" id="f_DATADISPARO">
            </div>
            <div class="col-md-4">
              <label class="form-label">Retorno PCC</label>
              <input type="text" class="form-control" id="f_RETORNOPCC">
            </div>
            <div class="col-md-4">
              <label class="form-label">Data Agendamento</label>
              <input type="date" class="form-control" id="f_DATAAGENDAMENTO">
            </div>
            <div class="col-md-4">
              <label class="form-label">Data Conclusão</label>
              <input type="date" class="form-control" id="f_DATACONCLUSAO">
            </div>
            <div class="col-md-4">
              <label class="form-label">Executado Por</label>
              <select class="form-select" id="f_EXECUTADOPOR"></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Tipo de Cabo</label>
              <input type="text" class="form-control" id="f_TIPOCABO">
            </div>
            <div class="col-md-4">
              <label class="form-label">Metragem</label>
              <input type="text" class="form-control" id="f_METRAGEM">
            </div>
            <div class="col-md-4">
              <label class="form-label">Num. Draft</label>
              <input type="text" class="form-control" id="f_NUMDRAFT">
            </div>
            <div class="col-md-4">
              <label class="form-label">Rota</label>
              <input type="text" class="form-control" id="f_ROTA">
            </div>
            <div class="col-md-4">
              <label class="form-label">Quem está registrando? *</label>
              <select class="form-select" id="f_USUARIO" required></select>
              <small class="text-muted">Data e hora serão adicionadas automaticamente ao salvar.</small>
              <div class="small text-muted fst-italic mt-1" id="lastUsuarioInfo"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Observação</label>
              <textarea class="form-control" id="f_OBSERVACAO" rows="2"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Observação Conclusão</label>
              <textarea class="form-control" id="f_OBSERVACAOCONCLUSAO" rows="2"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
        <button type="button" class="btn btn-accent" id="btnSalvarItem"><i class="bi bi-save"></i> Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     MODAL: Confirmação de exclusão
     ============================================================ -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger"></i> Excluir registro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Tem certeza que deseja excluir o registro <strong id="deleteItemLabel"></strong>? Esta ação não pode ser desfeita.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnConfirmDelete"><i class="bi bi-trash"></i> Excluir</button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     MODAL: Itens agendados em uma data específica (via clique no gráfico)
     ============================================================ -->
<div class="modal fade" id="dateItemsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-calendar-event"></i> <span id="dateItemsTitlePrefix">Agendamentos em</span> <span id="dateItemsLabel"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="table table-sm date-items-table mb-0">
            <thead>
              <tr>
                <th>ID</th><th>Cliente</th><th>Endereço</th><th>Cidade</th><th>Tecnologia</th>
                <th>VT</th><th>Status</th><th>Data Agend.</th><th>Data Conclusão</th>
                <th>Tipo Cabo</th><th>Metragem</th><th>Draft</th><th>Rota</th>
              </tr>
            </thead>
            <tbody id="dateItemsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
